services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gluzo
      POSTGRES_PASSWORD: gluzo
      POSTGRES_DB: gluzo_gateway
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gluzo -d gluzo_gateway"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    env_file:
      - path: .env
        required: false
    environment:
      # Service-to-service addresses override whatever .env holds for local runs.
      DATABASE_URL: postgres://gluzo:gluzo@postgres:5432/gluzo_gateway?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      LOG_DIRECTORY: /app/storage/logs
      WORKFLOW_DIRECTORY: /app/storage/workflows
    ports:
      - "8080:8080"
    volumes:
      - gateway-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  gateway-storage:
